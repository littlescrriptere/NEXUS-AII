
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUX AII</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090711;color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
}
header{
 padding:22px 18px;
 border-bottom:1px solid #302044;
 display:flex;justify-content:space-between;
 align-items:center;
}
.logo{font-size:25px;font-weight:900}
.logo span{color:#a855f7}
.status{color:#b99bdc;font-size:12px}
main{max-width:750px;margin:65px auto;padding:20px}
h1{font-size:38px;margin-bottom:10px}
h1 span{color:#a855f7}
.subtitle{color:#aaa;line-height:1.6}
.panel{
 margin-top:35px;padding:20px;
 background:#151020;border:1px solid #392451;
 border-radius:18px;
}
</textarea
 width:100%;height:130px;resize:vertical;
 background:#0c0913;color:white;
 border:1px solid #49305e;border-radius:12px;
 padding:15px;font-size:16px;outline:none;
}
textarea:focus{border-color:#a855f7}
button{
 width:100%;margin-top:14px;padding:16px;
 border:0;border-radius:12px;
 background:linear-gradient(90deg,#7c3aed,#c026d3);
 color:white;font-size:16px;font-weight:bold;
 cursor:pointer;
}
button:active{opacity:.8}
#result{
 display:none;margin-top:20px;
 background:#0c0913;padding:17px;
 border:1px solid #49305e;border-radius:12px;
 line-height:1.6;overflow-wrap:anywhere;
}
.tags{display:flex;flex-wrap:wrap;gap:9px;margin-top:22px}
.tag{
 background:#20152f;color:#d8b4fe;
 padding:9px 12px;border-radius:20px;font-size:13px;
}
footer{text-align:center;color:#777;padding:35px;font-size:12px}
</style>
</head>
<body>
<header>
 <div class="logo">NEXUX <span>AII</span></div>
 <div class="status">✦ CREATION STUDIO</div>
</header>

<main>
 <h1>Imagine it.<br><span>Build it.</span></h1>
 <p class="subtitle">
 Welcome to NEXUX AII. Describe what you want to create.
 Your AI creation studio starts here.
 </p>

 <div class="panel">
  <h3>✦ What should I build for you?</h3>
  <textarea id="prompt" placeholder="Example: Build me a purple gaming website..."></textarea>
  <button onclick="generate()">✦ Generate</button>
  <div id="result"></div>
 </div>

 <div class="tags">
  <div class="tag">🌐 Websites</div>
  <div class="tag">🎮 Games</div>
  <div class="tag">💻 Scripts</div>
  <div class="tag">🤖 Bots</div>
  <div class="tag">🎨 Designs</div>
 </div>
</main>

<footer>© 2026 NEXUX AII · YOUR IDEAS. YOUR CREATIONS.</footer>

<script>
function generate(){
 const prompt=document.getElementById("prompt").value.trim();
 const result=document.getElementById("result");

 if(!prompt){
  alert("Please describe what you want to build!");
  return;
 }

 result.style.display="block";
 result.innerHTML=
 "<strong>✦ NEXUX AII</strong><br><br>"+
 "Your request has been received:<br>"+
 "<em>"+escapeHTML(prompt)+"</em><br><br>"+
 "Your creation studio is ready! The AI engine still needs to be connected before it can generate real projects.";
}
function escapeHTML(text){
 return text.replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
 });
}
</script>
</body>
</html>
